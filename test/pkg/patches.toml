from = "7eabf057dde682ab61818030d3b0b2d61ab7053b"
to = "73a85aacaff675d099841e86a95476ecdc308d1f"
paths = ["src"]

[[Pkg.patch]]
name = "JuliaLang/Pkg.jl#4898 trim-update-manifest-entry"
pr = "JuliaLang/Pkg.jl#4898"
repo = "https://github.com/pankgeorg/Pkg.jl"
merge_base_with = "https://github.com/JuliaLang/Pkg.jl master"
from = "7eabf057dde682ab61818030d3b0b2d61ab7053b"
to = "40ea6e0ba9257f647701c84f6cc83323940a7968"
paths = ["src"]

[[Pkg.patch]]
name = "JuliaLang/Pkg.jl#4899 trim-instantiate-checks (release-1.13 backport)"
pr = "JuliaLang/Pkg.jl#4899"
# the PR's src/ diff doesn't apply to release-1.13: its backport, one commit on top of the
# patches above (made from the PR at 24e08dbcb)
